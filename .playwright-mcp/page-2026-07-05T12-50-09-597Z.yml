        - generic [ref=f11e25]:
          - paragraph [ref=f11e26]: Setiap pulang sekolah, aku selalu duduk di bangku kayu depan rumah, menunggu amarah Ayah mereda. Hari ini, tas sekolahku masih menyimpan surat peringatan dari guru – nilai matematikaku anjlok lagi. Aku tahu apa yang akan terjadi, sebuah teriakan tentang “anak tak tahu balas budi”, “pengorbanan orang tua”, dan pada akhirnya, semua buku catatan sekolahku berakhir dalam keadaan tercabik-cabik di depan mataku.
          - paragraph [ref=f11e27]: Tapi yang kudapatkan malah lebih buruk. Ayah hanya diam. Matanya menyipit melihat surat itu, lalu dengan tenang merobeknya menjadi empat bagian.
          - paragraph [ref=f11e28]: “Kau pikir ini cukup menyakitkan?” tanyanya sambil menyalakan kompor. “Nanti malam, kau kerjakan 100 soal. Satu saja salah, kau tahu sendiri akibatnya!”
          - paragraph [ref=f11e29]: Malam itu di kamar yang dingin dengan jendela yang berderit, tanganku gemetar memegang pensil. Setiap kali aku salah, cambuk rotan di dinding berbunyi “thok!” – tanda hitungan bertambah.
          - paragraph [ref=f11e30]: Ibuku di ruang sebelah hanya bisa membisu. Aku tahu, besok pagi akan ada kotak makan siang berisi nasi dan telur dadar di tas sekolahku, dan selembar uang lima ribu rupiah yang masih hangat dari sakunya.
          - paragraph [ref=f11e31]: Di sekolah, teman-temanku mengira aku pendiam. Mereka tak tahu, lidahku sudah lama kubungkam sendiri. Lebih baik diam daripada salah bicara. Lebih baik tak terlihat daripada jadi sasaran.
          - paragraph [ref=f11e32]: Kau punya gunung berapi dalam dirimu. Jangan biarkan ia meletus sembarangan.
          - paragraph [ref=f11e33]: Hingga suatu hari, Bu Rani, guru seni yang selalu pakai jilbab ungu, menaruh secarik kertas di mejaku.
          - paragraph [ref=f11e34]: “Kau punya gunung berapi dalam dirimu. Jangan biarkan ia meletus sembarangan, tapi jadikan itu sebuah kekuatan yang mampu membangkitkan potensi diri.”
          - paragraph [ref=f11e35]: Aku menatapnya bingung. Tapi tangannya yang hangat memegang bahuku, dan untuk pertama kalinya dalam enam belas tahun hidupku, aku merasakan sesuatu yang asing. Yaitu, sebuah keyakinan.
          - paragraph [ref=f11e36]: Malam itu, alih-alih mengerjakan soal matematika Ayah, aku mencoret-coret kertas bekas. Garis-garis merah seperti lava yang mengalir dari gunung dalam dadaku.
          - paragraph [ref=f11e37]: Aku mulai mencuri-curi waktu sepulang sekolah, duduk di perpustakaan kecil yang berdebu untuk membaca buku seni. Di antara rak-rak yang jarang dikunjungi, kutemukan dunia baru. Lukisan Affandi yang berapi-api, puisi Chairil Anwar yang meledak-ledak. Aku pun menyalinnya di buku catatan matematika – coretan-coretan liar yang tersembunyi di balik rumus-rumus mati.
          - paragraph [ref=f11e38]: Suatu sore, Ayah menemukan buku itu.
          - paragraph [ref=f11e39]: “Jadi ini yang kau lakukan dengan waktumu?” rahangnya mengeras saat merobek halaman demi halaman. Tapi kali ini, sesuatu dalam diriku ikut terkoyak. Bukan rasa takut, tapi amarah yang anehnya terasa dingin.
          - paragraph [ref=f11e40]: Bu Rani memberiku sketchbook bekas. “Gunung berapi butuh yang namanya saluran,” bisiknya saat melihat tanganku yang masih bergetar.
          - paragraph [ref=f11e41]: Aku mulai menggambar di balik gudang sekolah, di bawah cahaya lampu jalan yang temaram. Gambarku jelek – wajah-wajah tanpa mulut, pohon-pohon dengan akar menjulur seperti tangan yang mencekik.
          - paragraph [ref=f11e42]: Teman sekelasku, Rudi, mengolok-olok saat tak sengaja melihatnya.
          - paragraph [ref=f11e43]: “Apa ini? Setan?!”
          - paragraph [ref=f11e44]: Aku menatapnya lama. Tiba-tiba, kata-kata meluncur tanpa kusadari. “Ini gambaran isi kepalamu yang kosong.”
          - paragraph [ref=f11e45]: Seluruh kelas terbahak. Untuk pertama kalinya, suaraku terdengar.
          - paragraph [ref=f11e46]: Ayah tak tahu sketchbook itu. Ia terlalu sibuk dengan proyek untuk “menjadikanku seorang insinyur” seperti dirinya. Setiap malam, kami bertempur dalam diam – ia dengan deretan soal matematika, aku dengan garis-garis liar di buku rahasia.
          - paragraph [ref=f11e47]: Ayahmu… sebenarnya ia hanya takut. Dia takut kau akan menderita seperti dia.
          - paragraph [ref=f11e48]: Sampai suatu malam, ibuku masuk ke kamar dengan membawa susu hangat.
          - paragraph [ref=f11e49]: “Ayahmu… sebenarnya ia hanya takut,” bisiknya sambil menatap coretanku yang gelap. “Dia takut kau akan menderita seperti dia.”
          - paragraph [ref=f11e50]: Tangannya yang biasanya dingin, kali ini menjadi hangat. Aku melihat bayangan air mata di matanya – lava yang tak pernah sempat meletus.
          - paragraph [ref=f11e51]: Sketchbook pertamaku penuh pada bulan ketiga. Bu Rani diam-diam memajang salah satu karyaku di ruang guru – sebuah gambar pensil bergaya kubisme di mana wajah ayahku tersusun dari kalkulator rusak dan deretan angka. Ketika kepala sekolah menanyakan identitas senimannya, Bu Rani hanya tersenyum.
          - paragraph [ref=f11e52]: “Ini suara yang telah lama terpendam,” katanya.
          - paragraph [ref=f11e53]: Aku tahu kabar itu akan sampai ke ayah. Aku telah siap untuk menghadapi badai.
          - paragraph [ref=f11e54]: Tapi yang datang justru keheningan yang lebih dalam. Ayah memandangiku sepanjang makan malam dengan matanya yang merah – seperti baru saja menghadapi soal matematika yang tak bisa dipecahkan.
          - paragraph [ref=f11e55]: “Kau pikir seni bisa memberimu makan?” suaranya pecah saat mengajakku duduk di teras rumah tengah malam. Ini pertama kalinya dalam setahun ia tidak menyuruhku untuk mengerjakan soal.
          - paragraph [ref=f11e56]: Aku menatap langit yang sama gelapnya dengan tintaku.
          - paragraph [ref=f11e57]: “Aku tidak menggambar untuk makan. Aku menggambar untuk tidak mati.”
          - paragraph [ref=f11e58]: Angin malam membawa bau tembakau rokoknya. Lama kami duduk dalam diam, dua gunung berapi yang saling merasakan getarnya.
          - paragraph [ref=f11e59]: Pagi berikutnya, ada buku gambar baru di meja belajarku – jenis yang mahal, dengan kertas tebal. Tidak ada catatan. Tidak perlu.
          - paragraph [ref=f11e60]: Rudi dan kawan-kawannya mengerumuniku lagi saat aku menggambar di kantin.
          - paragraph [ref=f11e61]: “Dasar anak gila!” ledeknya sambil menyikut sketchbook-ku.
          - paragraph [ref=f11e62]: Tapi kali ini, sesuatu dalam diriku sudah berbeda. Daripada menggigit bibir, tanganku mencoret di kertas – mengubah wajah Rudi menjadi karikatur dengan mulut berbentuk tong sampah.
          - paragraph [ref=f11e63]: “Lihat, ini kamu sedang makan kata-katamu sendiri,” kataku sambil menyodorkan sebuah gambar.
          - paragraph [ref=f11e64]: Seluruh kantin tertawa. Rudi merah padam. Saat itulah aku sadar, tekanan ayah selama ini ternyata memberiku senjata – kemampuan untuk mengubah rasa sakit menjadi sesuatu yang bisa kutertawakan.
          - paragraph [ref=f11e65]: Ketika formulir pemilihan jurusan kuliah beredar, meja makan kami berubah menjadi medan perang. Ayah menatapku dengan pandangan yang biasa ia gunakan untuk memecahkan persamaan diferensial – seolah-olah hidupku adalah soal yang harus diselesaikan dengan satu metode benar.
          - paragraph [ref=f11e66]: “Seni? Kau ingin jadi pengemis?” tanyanya sambil meremas sudut kertas formulir.
          - paragraph [ref=f11e67]: Tapi kali ini, tanganku tidak gemetar saat kuambil pulpen dari kotaknya. “Aku mau jadi orang yang jujur pada diri sendiri. Tidak seperti ayah.”
          - paragraph [ref=f11e68]: Udara di ruangan itu langsung membeku. Terdengar suara pecahan piring di area dapur, tempat ibuku sedang membersihkan bekas makan malam kami.
          - paragraph [ref=f11e69]: Setelah kejadian itu, ayah mengurung diri di kamarnya selama dua hari. Aku menggambar tanpa henti – wajahnya yang keras, tangannya yang kasar, dan air mata yang tak pernah keluar. Bu Rani, yang kini menjadi semacam ibu kedua, membantuku menyiapkan berkas untuk persiapan kuliah.
          - paragraph [ref=f11e70]: “Kau tahu kenapa lava itu berharga?” tanyanya suatu sore sambil memeriksa karyaku. “Karena tekanan bawah tanah menciptakan batu permata.”
          - paragraph [ref=f11e71]: Malam kedua, ayah muncul dengan mata berkantung hitam. Tanpa sepatah kata, ia meletakkan brosur Institut Seni Jakarta di atas meja. Di sudutnya ada coretan pensil tipis – perhitungan biaya kuliah dan daftar beasiswa yang bisa kudaftar.
          - paragraph [ref=f11e72]: Aku mau jadi orang yang jujur pada diri sendiri. Tidak seperti ayah.
          - paragraph [ref=f11e73]: Ujian akhir seni di sekolahku jatuh pada hari ulang tahun ayah. Aku mempersembahkan gambar terbesarku. Sebuah potret dirinya sebagai gunung berapi, dengan lereng-lereng yang terbentuk dari rumus matematika, dan kawah yang memuntahkan warna-warna cerah.
          - paragraph [ref=f11e74]: “Judulnya apa?” tanya Bu Rani dengan suara bergetar.
          - paragraph [ref=f11e75]: “Kawah Gunung Dalam Dada,” jawabku.
          - paragraph [ref=f11e76]: Ayah hadir di pameran itu. Ia berdiri di depan gambarku selama tiga puluh menit penuh, lalu pergi tanpa komentar. Tapi sore itu, kutemukan ia di garasi – tangan kotornya memegang kuas cat, mencoba membuat gradasi warna di kaleng bekas.
          - paragraph [ref=f11e77]: Kuliah seni ternyata bukan pelarian seperti dugaanku. Justru di sini, di antara kanvas-kanvas kosong dan kritik pedas dosen, aku bertemu kembali dengan semua rasa yang terkubur selama ini. Setiap kali kuas menyentuh bidang gambar, suara ayah bergema di kepalaku. “Masih belum cukup baik.”
          - paragraph [ref=f11e78]: Suatu malam, saat aku frustrasi merusak karya untuk kesekian kalinya, telepon berbunyi. Dari layar tersambar nama yang tak pernah kuharapkan. Ayah.
          - paragraph [ref=f11e79]: “Kau… apa kau butuh uang tambahan untuk bahan?” tanyanya dengan suara kaku, seolah tengah membaca skrip.
          - paragraph [ref=f11e80]: Aku tertegun. Di belakangnya, kudengar suara ibu berbisik. “Pelan-pelan, Yah!”
          - paragraph [ref=f11e81]: Liburan semester pertama, kutemukan ayah telah mengubah gudang belakang menjadi studio sederhana. Ada kanvas setengah jadi di easel – lanskap gunung dengan perspektif yang kacau.
          - paragraph [ref=f11e82]: “Jelek, ya?” tanyanya sambil membersihkan kuas.
          - paragraph [ref=f11e83]: Aku melihat tangannya yang dulu, hanya memegang pensil teknik, kini telah ternoda cat biru.
          - paragraph [ref=f11e84]: Kupandangi karyanya. Ada kesungguhan di setiap goresan yang salah.
          - paragraph [ref=f11e85]: “Jauh lebih baik dari apa yang kubayangkan,” jawabku jujur.
          - paragraph [ref=f11e86]: Senyum kecil muncul di wajahnya. “Kau tahu, di matematika ada yang namanya fractal – pola yang terus berulang tapi selalu berbeda.” Jarinya menunjuk ke kanvasnya. “Ini salah, tapi salah yang… jujur.”
          - paragraph [ref=f11e87]: Hubungan kami tak pernah benar-benar mulus. Masih ada pertengkaran tentang masa depan, tentang definisi kesuksesan. Tapi sekarang kami bertengkar dengan warna – aku dengan palet cat airku, dan ayah dengan akriliknya yang berantakan.
          - paragraph [ref=f11e88]: Ibu juga tak kalah ikut bersaing dan mulai belajar melukis di setiap akhir pekan. Keluarga yang dulu bisu, kini berkomunikasi melalui warna-warna yang menetes di lantai teras.
          - paragraph [ref=f11e89]: Suatu pagi, ayah menyerahkan amplop tebal. “Untuk pameran pertamamu,” katanya sambil melihat ke arah lain.
          - paragraph [ref=f11e90]: Isinya bukan cuma uang – ada kliping semua lomba seni yang bisa kuikuti, dengan catatan margin berisi penuh dengan perhitungan biaya.
          - paragraph [ref=f11e91]: Di sudut terakhir, terselip satu kalimat.
          - paragraph [ref=f11e92]: “Masih banyak hal yang harus ayah pelajari tentangmu, tapi ayah tetap mengerti satu hal.”
          - paragraph [ref=f11e93]: "Pameran pertamaku digelar di galeri kampus – judulnya ‘Fractal : Jejak yang Berulang’. Karya utamanya adalah instalasi interaktif, sebuah kalkulator tua milik ayah yang dihancurkan, lalu disusun kembali menjadi patung kecil dengan LED yang menyala setiap kali penonton menyentuhnya."
          - paragraph [ref=f11e94]: Ayah datang dengan kemeja kotak-kotak yang biasanya hanya dipakai untuk acara resmi. Ia berdiri di depan instalasi itu selama 20 menit, lalu tiba-tiba bertanya, “Ini… bukankah ini simbol perasaanmu waktu kecil?”
          - paragraph [ref=f11e95]: “Bukan,” jawabku sambil mengatur intensitas lampu. “Ini simbol kita sekarang. Bagian-bagian yang dulunya kaku, sekarang bisa memancarkan cahayanya sendiri.”
          - paragraph [ref=f11e96]: Seorang kurator ternyata hadir di pameran itu.
          - paragraph [ref=f11e97]: “Karyamu punya suara yang unik,” katanya sambil menyerahkan sebuah kartu nama. “Ada kedalaman dan kemarahan, tapi juga sebuah harapan.”
          - paragraph [ref=f11e98]: Ayah mendengar itu langsung mengeluarkan kalkulator dari saku. “Kalau dibagi biaya transportasi dan material, fee yang dia minta di sini kurang layak….”
          - paragraph [ref=f11e99]: “Pak,” potong sang kurator sambil tersenyum. “Seni tidak bisa dihitung dengan rumus.”
          - paragraph [ref=f11e100]: Aku menahan tawa melihat wajah ayah yang bingung. Tapi kemudian ia mengangguk pelan. “Harusnya pakai algoritma, ya?”
          - paragraph [ref=f11e101]: Karyamu punya suara yang unik. Ada kedalaman dan kemarahan, tapi juga sebuah harapan.
          - paragraph [ref=f11e102]: Karya-karyaku mulai dikenal. Wartawan mewawancarai tentang “proses kreatif”. Aku bercerita tentang losban tempat ibu menjemur pakaian, tentang rotan yang patah di dinding kamar, tentang guru seni dengan jilbab ungu kesukaannya.
          - paragraph [ref=f11e103]: Suatu sore, ayah menelepon dengan suara aneh. “Ayah baru lihat karyamu di majalah,” katanya. “Itu… bagus.”
          - paragraph [ref=f11e104]: Malam itu, untuk pertama kalinya dalam hidupku, ayah mengirim sebuah chat dengan lampiran foto di dalamnya.
          - paragraph [ref=f11e105]: “Ayah sedang belajar melukis pohon. Akarnya harus kuat seperti persamaan dasar, tapi dahannya boleh liar seperti abstrak. Benar tidak?”
          - paragraph [ref=f11e106]: Kubalas chat itu dengan foto sketchbook terbaruku – gambar kami bertiga sebagai tiga gunung dengan magma yang saling terhubung.
          - paragraph [ref=f11e107]: Namun, kesuksesan pertamaku malah berujung pada krisis terbesar. Sebuah perusahaan desain menawariku kolaborasi dengan bayaran fantastis – dengan syarat mengubah gaya karya menjadi “lebih marketable”. Saat kuceritakan pada ayah, ekspresinya berubah.
          - paragraph [ref=f11e108]: “Ambil saja,” katanya sambil mencoret-coret di buku catatannya. “Ini bisa membiayaimu bertahun-tahun.”
          - paragraph [ref=f11e109]: Tapi kali ini, justru aku yang menolak. “Aku tidak mau jadi seperti ayah yang dulu, terjebak pekerjaan yang membunuh jiwanya sendiri.”
          - paragraph [ref=f11e110]: Udara antara kami kembali tegang. Ayah menatapku lama, lalu tiba-tiba tersenyum pahit.
          - paragraph [ref=f11e111]: “Kau lebih berani dari ayah.”
          - paragraph [ref=f11e112]: Aku pun memilih jalan lain – mengajar seni di komunitas anak-anak marginal. Gajinya cukup untuk membeli cat, namun tak cukup untuk sewa apartemen. Tapi setiap kali melihat murid-muridku yang dulu takut memegang kuas, kini berani mencoretkan warna di kanvas, rasanya seperti menemukan jejak potongan diri yang telah lama hilang.
          - paragraph [ref=f11e113]: Suatu hari ayah datang diam-diam ke kelas. Ia duduk di bangku paling belakang memperhatikan seorang anak lelaki yang sedang berjuang menggambar lingkaran sempurna.
          - paragraph [ref=f11e114]: “Anak itu persis sepertimu dulu,” bisiknya saat kami dalam perjalanan pulang.
          - paragraph [ref=f11e115]: Kini studio kecilku berdiri di samping rumah orangtua. Ayah yang membangunnya – dengan ventilasi khusus untuk bau cat, dan rak-rak yang diukur presisi untuk menyimpan kanvas.
          - paragraph [ref=f11e116]: “Masih kurang?” tanyanya bangga saat menunjukkan hasil kerjanya.
          - paragraph [ref=f11e117]: Kujawab dengan melukis langsung di dinding studio. Sebuah gunung berapi yang meletus membentuk bunga.
          - paragraph [ref=f11e118]: “Sudah sempurna.”
          - paragraph [ref=f11e119]: Di sudut ruangan, ibu menyiapkan teh untuk kami bertiga. Di luar, anak-anak komunitas sudah berdatangan dengan karya mereka yang penuh warna – lava-lava kecil yang siap mengubah dunia.
          - paragraph [ref=f11e120]: Di tahun ketiga mengajar di komunitas, Bu Rani meninggal dunia. Di samping nisannya kami menaruh toples besar yang berisi ratusan origami burung – karya murid-muridnya yang dulu dianggap tak punya masa depan.
          - paragraph [ref=f11e121]: Aku melukis potretnya di dinding kelas, dengan jilbab ungu yang berubah menjadi warna-warni yang mengaliri wajah setiap anak-anak.
          - paragraph [ref=f11e122]: Ayah yang dulu tak pernah menangis, kini memelukku erat. “Dia lah orang yang telah memberimu sayap.”
          - paragraph [ref=f11e123]: “Dan kau yang memberiku akar,” sambungku.
          - paragraph [ref=f11e124]: Pameran terbesarku digelar di gedung kesenian ternama. Karya utamanya adalah instalasi interaktif berjudul Kawah-kawah Kecil. Di mana terdapat sebuah ruangan imajiner yang membuat para pengunjung merasakan getaran vulkanik di bawah kaki, sambil melihat proyeksi wajah-wajah orang biasa yang tengah berjuang – tukang becak, ibu rumah tangga, dan guru honorer.
          - paragraph [ref=f11e125]: Dia lah orang yang telah memberimu sayap.
          - paragraph [ref=f11e126]: Di sudut khusus, ada foto ayah muda dengan seragam teknik, ibu dengan buku resep usang, dan Bu Rani yang tengah memegang kapur tulis.
          - paragraph [ref=f11e127]: “Kenapa tidak sekalian pakai rumus matematika?” tanya seorang pengkritik.
          - paragraph [ref=f11e128]: “Karena hidup bukan persamaan yang harus diselesaikan,” jawabku. “Tapi kanvas yang harus diisi.”
          - paragraph [ref=f11e129]: Dan pagi ini, seperti biasa, aku membuka kelas untuk anak-anak di studio. Ayah – yang kini pensiun dini – menjadi asistenku yang paling rajin. Tangannya yang dulu kaku memegang penggaris, kini luwes memotong kertas warna-warni.
          - paragraph [ref=f11e130]: “Pak Guru!” seru seorang murid kecil sambil mengacungkan gambarnya. “Aku bikin gunung berapi seperti punyamu!”
          - paragraph [ref=f11e131]: Kupandangi coretannya – gunung dengan kawah berbentuk hati, mengeluarkan lava pelangi.
          - paragraph [ref=f11e132]: Ayah menyipitkan mata. “Erupsi efusif, ya? Bisa jadi stratovolcano yang baik nanti.”
          - paragraph [ref=f11e133]: Tawa kami menggema di seluruh ruangan. Di luar, matahari terbit menyinari dinding studio tempat lukisan kami bertiga yang masih basah – sebuah keluarga yang akhirnya menemukan bahasanya sendiri dalam warna, dalam tekanan yang membentuk, dalam letupan-letupan kecil yang melahirkan keindahan.
